name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.93'
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - platform: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Validate release version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tinyllm") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag must match Cargo.toml version: v$version" >&2
            exit 1
          fi
      - name: Install musl tools
        if: startsWith(matrix.platform, 'linux-')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --locked --all-targets --target "$TARGET"
      - name: Build
        run: |
          export GIT_SHA="$GITHUB_SHA"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export BUILD_DATE
          cargo build --locked --release --bin tinyllm --target "$TARGET"
          test "$("target/$TARGET/release/tinyllm" --version)" = "tinyllm ${GITHUB_REF_NAME#v}+${GIT_SHA:0:7} $BUILD_DATE"
      - name: Package
        run: |
          archive="tinyllm-$GITHUB_REF_NAME-$PLATFORM.tar.gz"
          stage="$RUNNER_TEMP/tinyllm-$PLATFORM"
          mkdir -p "$stage"
          cp "target/$TARGET/release/tinyllm" LICENSE README.md tinyllm.example.toml "$stage/"
          cp -R examples "$stage/"
          COPYFILE_DISABLE=1 tar -C "$stage" -czf "$archive" tinyllm LICENSE README.md tinyllm.example.toml examples
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tinyllm-${{ matrix.platform }}
          path: |
            tinyllm-*.tar.gz
            tinyllm-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0

  docker:
    needs: cli
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: true

  release:
    needs: [cli, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tinyllm-*
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          cat ./*.sha256 | sort -k2 > checksums.txt
          sha256sum --check checksums.txt
      - name: Release metadata
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${TAG%%+*}" == *-* ]]; then
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.release.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
