[package]
name = "tinyllm"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Anthropic and OpenAI gateway with native provider authentication"

[dependencies]
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
bytes = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
subtle = "2"
eventsource-stream = "0.2"
eyre = "0.6"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shellexpand = { version = "3", default-features = false, features = ["base-0"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "fs", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
strip = true
